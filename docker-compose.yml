# Local stack: a PostgreSQL warehouse and Airflow running the daily DAG.
#
#   docker compose up -d
#   open http://localhost:8080   (user "admin"; the password is printed in `docker compose logs airflow`)
#
# The warehouse is also reachable from the host on port 5433 for psql or a BI tool.

services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grid
    ports: ["5433:5432"]
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.4.0-python3.12
    command: standalone
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid
      # Fine for a laptop; bake these into an image for anything longer-lived.
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.12.7 dbt-postgres==1.11.0 psycopg[binary]==3.2.3 requests==2.32.3"
      PGHOST: warehouse
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: grid
    ports: ["8080:8080"]
    volumes:
      - ./:/opt/pipeline
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

volumes:
  warehouse-data:
