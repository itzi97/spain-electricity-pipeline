version: 2

models:
  - name: dim_technology
    description: The technologies REE reports, with the group and renewable flag used throughout.
    columns:
      - name: technology_id
        data_tests: [unique, not_null]
      - name: is_renewable
        data_tests: [not_null]

  - name: fct_generation_daily
    description: Net generation per technology per day, MWh. Excludes REE's total row.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [generation_day, technology_id]
    columns:
      - name: technology_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_technology')
                field: technology_id

  - name: mart_daily_mix
    description: One row per day with total and renewable generation and the renewable share.
    columns:
      - name: generation_day
        data_tests: [unique, not_null]
      - name: total_mwh
        data_tests:
          - not_null
          - values_at_least:
              arguments:
                minimum: 1
      - name: renewable_share
        description: Renewable net generation divided by total net generation, 0 to 1.
        data_tests:
          - not_null
          - values_between:
              arguments:
                minimum: 0
                maximum: 1
      - name: renewable_share_7d
        description: Trailing 7-day ratio of sums (renewable MWh over total MWh).
        data_tests:
          - values_between:
              arguments:
                minimum: 0
                maximum: 1

  - name: mart_monthly_mix
    description: Net generation per month and technology group, with each group's share of the month.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [month, technology_group]
    columns:
      - name: days_with_data
        data_tests:
          - values_between:
              arguments:
                minimum: 1
                maximum: 31
